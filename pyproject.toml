[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defect-inspector-grpc"
version = "0.1.0"
description = "Servicio desacoplado de inspección de defectos superficiales en acero laminado (NEU-DET) con gRPC, frontend HTML/JS modular, modelo MaaS ResNet-18 ONNX, SDD y MLflow"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Omar David Sánchez Jiménez", email = "odsanchez@uao.edu.co" },
]
keywords = [
    "computer-vision",
    "surface-defect-detection",
    "neu-det",
    "grpc",
    "onnxruntime",
    "mlflow",
    "sdd",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "fastapi>=0.115.0",
    "grpcio>=1.68.0",
    "grpcio-health-checking>=1.68.0",
    "grpcio-tools>=1.68.0",
    "huggingface-hub>=0.26.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.18.0,<4.0",
    "numpy>=2.0.0",
    "onnxruntime>=1.20.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "python-multipart>=0.0.17",
    "scikit-learn>=1.5.1,<1.9",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
]

[tool.uv]
constraint-dependencies = ["anyio>=4.0,<4.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/defect_inspector"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".venv", "src/defect_inspector/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
