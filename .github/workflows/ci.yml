name: CI QA - Entrega Modulo 3

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  quality-and-tests:
    name: Python 3.13 · uv · Ruff · Pytest (>=120)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install frozen dependencies
        run: uv sync --frozen

      - name: Verify ruff lint
        run: uv run ruff check .

      - name: Verify ruff formatting
        run: uv run ruff format --check .

      - name: Execute offline pytest suite (>=120)
        run: |
          TEST_SUMMARY=$(uv run pytest -q)
          echo "$TEST_SUMMARY"
          uv run python scripts/verify_ci.py --skip-subprocess
