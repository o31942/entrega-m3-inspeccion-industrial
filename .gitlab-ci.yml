stages:
  - lint
  - test
  - build
  - deploy

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: "copy"
  DOCKER_DRIVER: "overlay2"
  DOCKER_TLS_CERTDIR: "/certs"
  CONTAINER_NAME: "defect-inspector"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .cache/uv

lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  needs: ["lint"]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git libglib2.0-0 libgomp1 && rm -rf /var/lib/apt/lists/*
  script:
    - uv sync --frozen
    - uv run pytest -q --cov=defect_inspector --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
    - uv run python scripts/verify_ci.py --skip-subprocess
    - uv run python scripts/audit_m3.py
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage.xml
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build_image:
  stage: build
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - PKG_URL="${MODEL_PACKAGE_URL:-$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/neu-steel-defect-model/1.0.0/neu_resnet18.onnx}"
    - |
      DOCKER_BUILDKIT=1 docker build \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg MODEL_PACKAGE_URL="$PKG_URL" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE:latest" \
        .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - |
      if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_PASS:-}" ]; then
        DOCKERHUB_REPO="${DOCKERHUB_IMAGE:-$REGISTRY_USER/defect-inspector-grpc}"
        echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$DOCKERHUB_REPO:$CI_COMMIT_SHORT_SHA"
        docker tag "$CI_REGISTRY_IMAGE:latest" "$DOCKERHUB_REPO:latest"
        docker push "$DOCKERHUB_REPO:$CI_COMMIT_SHORT_SHA"
        docker push "$DOCKERHUB_REPO:latest"
      fi

deploy_droplet:
  stage: deploy
  image: alpine:3.20
  needs: ["build_image"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client curl
    - |
      test -n "${DROPLET_HOST:-}" || { echo "Falta variable CI DROPLET_HOST"; exit 1; }
      test -n "${SSH_KEY:-}" || { echo "Falta variable CI enmascarada SSH_KEY"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -f "$SSH_KEY" ]; then
        cp "$SSH_KEY" ~/.ssh/id_deploy
      elif printf '%s' "$SSH_KEY" | grep -q "BEGIN"; then
        printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
      else
        printf '%s' "$SSH_KEY" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_deploy
      fi
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - DEPLOY_USER="${DROPLET_USER:-root}"
    - DOMAIN="${PUBLIC_DOMAIN:-$(echo "$DROPLET_HOST" | tr '.' '-').sslip.io}"
    - IMAGE_REF="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DROPLET_HOST" \
        "echo '$CI_REGISTRY_PASSWORD' | docker login '$CI_REGISTRY' -u '$CI_REGISTRY_USER' --password-stdin && \
         docker pull '$IMAGE_REF' && \
         (docker rm -f '$CONTAINER_NAME' || true) && \
         docker run -d --name '$CONTAINER_NAME' --restart unless-stopped \
           -p 127.0.0.1:8000:8000 \
           -p 127.0.0.1:50051:50051 \
           -e SERVE_STATIC_FRONTEND=1 \
           -e CORS_ORIGINS='https://$DOMAIN,http://127.0.0.1:5173' \
           '$IMAGE_REF'"
    - |
      ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DROPLET_HOST" '
        for i in $(seq 1 25); do
          STATUS=$(docker inspect --format="{{.State.Health.Status}}" defect-inspector 2>/dev/null || echo "starting")
          echo "[Attempt $i/25] Container health: $STATUS"
          if [ "$STATUS" = "healthy" ]; then
            exit 0
          fi
          sleep 3
        done
        echo "ERROR: El contenedor no alcanzó estado healthy a tiempo."
        docker logs --tail 60 defect-inspector || true
        exit 1
      '
    - curl -fsS --retry 5 --retry-delay 3 "https://${DOMAIN}/health"
    - echo "[DEPLOY OK] Servicio activo y healthy en https://${DOMAIN}"
